server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  output:
    ansi:
      enabled: never
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/board_cutting_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_ROOT_PASSWORD}
  web:
    resources:
      static-locations: classpath:/static/,file:/app/static/

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
