server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  output:
    ansi:
      enabled: never
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/board_cutting_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_ROOT_PASSWORD}
  web:
    resources:
      static-locations: classpath:/static/,file:/app/static/

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

app:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:}
    bucket: ${ALIYUN_OSS_BUCKET:}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    board-texture-prefix: ${ALIYUN_OSS_BOARD_TEXTURE_PREFIX:board-textures/}
    public-base-url: ${ALIYUN_OSS_PUBLIC_BASE_URL:}
