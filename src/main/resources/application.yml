server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  output:
    ansi:
      enabled: never
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/board_cutting_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: '0625'

logging:
  charset:
    console: UTF-8

# JWT 配置
jwt:
  secret: ROTATED_JWT_SECRET
  expiration: 86400000

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
